# Builds the static site (tools/build_static.py) and publishes it to GitHub Pages
# on every push to main. One-time setup: see "Deploying" in README.md.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        env:
          # Web3Forms keys are public by design (they appear in the page HTML and can only
          # email the owner's inbox). A repository variable of the same name overrides this.
          WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY || 'c17f04ca-f628-4b93-99b0-34c3fff5fc86' }}
          # All enquiries (products, spare parts, services, other) -> enquiry@arcooling.in.
          # A repository variable of the same name overrides this.
          WEB3FORMS_KEY_ENQUIRY: ${{ vars.WEB3FORMS_KEY_ENQUIRY || '846406bd-2e1c-41d3-9d9c-da34ad9c92fd' }}
          AR_SITE_URL: https://arcooling.in
        run: python tools/build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
